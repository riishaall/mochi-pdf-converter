services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      STORAGE_DIR: /data
      RATE_LIMIT: ${RATE_LIMIT:-20/minute}
    ports:
      - "8000:8000"
    volumes:
      - pdf_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
    volumes:
      - pdf_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
    volumes:
      - pdf_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_GA_ID: ${VITE_GA_ID:-}
        VITE_ADSENSE_CLIENT_ID: ${VITE_ADSENSE_CLIENT_ID:-}
        VITE_ADSENSE_SLOT_ID: ${VITE_ADSENSE_SLOT_ID:-}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  pdf_data:
